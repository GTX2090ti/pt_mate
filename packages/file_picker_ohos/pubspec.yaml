name: file_picker
description: A package that allows you to use a native file explorer to pick single or multiple absolute file paths, with extension filtering support.
homepage: https://github.com/miguelpruivo/plugins_flutter_file_picker
repository: https://github.com/miguelpruivo/flutter_file_picker
issue_tracker: https://github.com/miguelpruivo/flutter_file_picker/issues
version: 10.3.10

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  flutter_plugin_android_lifecycle: ^2.0.22
  plugin_platform_interface: ^2.1.8
  ffi: ^2.1.3
  path: ^1.9.0
  win32: ^5.9.0
  cross_file: ^0.3.4+2
  web: ^1.1.0
  dbus: ^0.7.11

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

flutter:
  plugin:
    platforms:
      android:
        package: com.mr.flutter.plugin.filepicker
        pluginClass: FilePickerPlugin
        dartPluginClass: FilePickerIO
      ios:
        pluginClass: FilePickerPlugin
        dartPluginClass: FilePickerIO
      web:
        pluginClass: FilePickerWeb
        fileName: _internal/file_picker_web.dart
      macos:
        pluginClass: FilePickerPlugin
        dartPluginClass: FilePickerMacOS
      windows:
        dartPluginClass: FilePickerWindows
      linux:
        dartPluginClass: FilePickerLinux
      # [移植适配-OHOS] 关键：
      # FilePicker._instance 是 `static late`，只能由 Dart 插件注册器
      # （.dart_tool/flutter_build/dart_plugin_registrant.dart）里的
      # FilePickerIO.registerWith() 赋值。而该注册器只会为 pubspec 中
      # 显式声明了对应平台（且带 dartPluginClass）的插件生成注册分支。
      # 此前本包未声明 ohos → 注册器里 ohos 分支为空 →
      # 一访问 FilePicker.platform 就抛 LateInitializationError:
      # Field '_instance@...' has not been initialized.
      # 声明为「纯 Dart 插件」（只有 dartPluginClass，无 pluginClass）即可：
      # 原生 MethodChannel 接收端由 FilePickerOhos.ets 单独注册，二者互不影响。
      ohos:
        dartPluginClass: FilePickerIO
